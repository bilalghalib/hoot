<ion-header>
  <ion-toolbar>
    <ion-title>Hoot - Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-section">
      <h1>🦉 Hoot</h1>
      <p>Give a Hoot, Take a Hoot</p>
    </div>

    <div class="form-section">
      <ion-item>
        <ion-label position="floating">Username</ion-label>
        <ion-input
          type="text"
          [(ngModel)]="username"
          (keyup.enter)="onLogin()"
          [disabled]="loading"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input
          type="password"
          [(ngModel)]="password"
          (keyup.enter)="onLogin()"
          [disabled]="loading"
        ></ion-input>
      </ion-item>

      @if (errorMessage) {
        <ion-text color="danger">
          <p class="error-message">{{ errorMessage }}</p>
        </ion-text>
      }

      <ion-button
        expand="block"
        (click)="onLogin()"
        [disabled]="loading"
        class="login-button"
      >
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Login
        }
      </ion-button>

      <div class="register-link">
        <ion-text>
          Don't have an account?
          <a routerLink="/auth/register">Register here</a>
        </ion-text>
      </div>
    </div>
  </div>
</ion-content>
